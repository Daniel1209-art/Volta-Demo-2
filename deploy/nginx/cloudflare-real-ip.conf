# ── ВОССТАНОВЛЕНИЕ РЕАЛЬНОГО IP КЛИЕНТА ЗА CLOUDFLARE ──────────────────
# Подключается через `include` в server{}-блоках volta-demo.conf и
# dashboard-volta-demo.conf. Пока Cloudflare в режиме DNS-only (серое облако)
# этот блок ИНЕРТЕН: трафик приходит напрямую, remote_addr не из диапазонов
# CF ниже, заголовок CF-Connecting-IP отсутствует — nginx оставляет
# настоящий remote_addr как есть. Как только включат оранжевое облако, real_ip
# подменит remote_addr на IP реального клиента из CF-Connecting-IP — и лимитер
# входа в дашборд, и гео снова считают по игроку, а не по эджу Cloudflare.
#
# ВАЖНО: доверяем CF-Connecting-IP ТОЛЬКО когда соединение пришло с адреса из
# списка CF ниже. Прямой атакующий (не через CF) этот заголовок подделать не
# сможет — его remote_addr не в диапазонах, nginx проигнорирует подделку.
#
# Диапазоны — с https://www.cloudflare.com/ips (v4 + v6). ПЕРЕД включением
# оранжевого облака свериться со свежим списком: CF их меняет редко, но меняет.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
