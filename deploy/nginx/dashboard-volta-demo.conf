# VOLTA — dashboard.volta-demo.com (внутренняя аналитика).
# Источник правды — этот файл в репозитории; deploy.sh копирует его в
# /etc/nginx/sites-available/dashboard-volta-demo.conf (симлинк в sites-enabled).
#
# TLS-блоки и редирект http→https дописывает certbot --nginx, и его правки
# нужно КОПИРОВАТЬ ОБРАТНО в этот файл: иначе следующий deploy.sh затрёт их
# и сайт останется без сертификата.
#
# Статика дашборда лежит в /Dashboard репозитория — вне корня игры
# (/frontend), поэтому в бандл volta-demo.com она не попадает.
# API проксируется на тот же игровой бэкенд (127.0.0.1:8090), отдельного
# процесса нет: эндпоинты /api/dashboard/* живут в нём и ходят в БД
# отдельным read-only соединением.

server {
    server_name dashboard.volta-demo.com;

    root  /var/www/volta-demo.com/Dashboard;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # внутренний инструмент — из поиска исключаем на уровне заголовка тоже
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── API АНАЛИТИКИ ──────────────────────────────────────────────────
    # X-Forwarded-For обязателен: по нему бэкенд считает хеш IP для
    # ограничителя попыток входа (сырой адрес нигде не сохраняется)
    location /api/dashboard/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── СТАТИКА ────────────────────────────────────────────────────────
    # nginx-нюанс: add_header в location ОТМЕНЯЕТ add_header уровня server,
    # поэтому заголовки повторяются в каждом location с add_header.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # служебные файлы репозитория наружу не отдаём
    location ~ /\.(git|gitignore|env) {
        deny all;
    }

    listen 80;
    listen [::]:80;
}
