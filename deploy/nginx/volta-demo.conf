# VOLTA Demo — volta-demo.com (Hetzner, Ubuntu 24.04, host nginx).
# Файл кладётся в /etc/nginx/sites-available/volta-demo.conf
# и включается симлинком в /etc/nginx/sites-enabled/.
#
# Это HTTP-версия. После `certbot --nginx -d volta-demo.com -d www.volta-demo.com`
# certbot сам добавит 443-блоки, пути к сертификатам и редирект http -> https.

# www -> канонический домен ($scheme, чтобы работало и до, и после выпуска TLS)
server {
    listen 80;
    listen [::]:80;
    server_name www.volta-demo.com;
    return 301 $scheme://volta-demo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name volta-demo.com;

    root  /var/www/volta-demo.com/frontend;
    index index.html;

    # gzip: text/html сжимается всегда, остальное — по списку.
    # mp3/wav не сжимаем: уже компактны, только жгут CPU.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # nginx-нюанс: add_header в location ОТМЕНЯЕТ add_header уровня server,
    # поэтому security-заголовки повторяются в каждом location с add_header.

    # аудио не меняется — длинный immutable-кеш
    location ~* \.(mp3|wav)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # сама страница всегда ревалидируется — правки видны сразу после deploy.sh
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # служебные файлы репозитория наружу не отдаём
    location ~ /\.(git|gitignore) {
        deny all;
    }
}
