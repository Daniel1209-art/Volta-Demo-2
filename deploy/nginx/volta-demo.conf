# VOLTA Demo — volta-demo.com (Hetzner, Ubuntu 24.04, host nginx).
# Источник правды — этот файл в репозитории; deploy.sh копирует его в
# /etc/nginx/sites-available/volta-demo.conf (симлинк в sites-enabled).
#
# TLS-блоки и редирект http→https добавлены certbot-ом (пути /etc/letsencrypt
# существуют на сервере после `certbot --nginx`). Статику отдаёт nginx;
# бэкенд (Node, 127.0.0.1:8090) наружу не выставляется — только прокси
# /ws (WebSocket) и /api с этого же домена, поэтому клиент ходит по wss://.

# www -> канонический домен
server {
    server_name www.volta-demo.com;
    return 301 https://volta-demo.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/volta-demo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/volta-demo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name volta-demo.com;

    root  /var/www/volta-demo.com/frontend;
    index index.html;

    # gzip: text/html сжимается всегда, остальное — по списку.
    # mp3/wav не сжимаем: уже компактны, только жгут CPU.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # ── БЭКЕНД ─────────────────────────────────────────────────────────
    # WebSocket общего таймлайна раундов: wss://volta-demo.com/ws
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # ТОЛЬКО реальный адрес соединения ($remote_addr), НЕ $proxy_add_...:
        # последний прибавляет КЛИЕНТСКИЙ X-Forwarded-For слева, а бэкенд по нему
        # ключует лимитер входа — подделкой заголовка его обходили. real_ip ниже
        # подменяет $remote_addr на настоящий IP клиента, когда трафик идёт через
        # Cloudflare, так что эта строка верна и с оранжевым облаком, и без него.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;          # долгоживущее соединение, не рвать по 60s
        proxy_send_timeout 1h;
    }
    # служебное API бэкенда (health-check)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # см. пояснение в /ws выше
    }
    # общий движок клиента и сервера — лежит в репозитории ВНЕ корня статики
    location /shared/ {
        alias /var/www/volta-demo.com/shared/;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # ── СТАТИКА ────────────────────────────────────────────────────────
    # nginx-нюанс: add_header в location ОТМЕНЯЕТ add_header уровня server,
    # поэтому security-заголовки повторяются в каждом location с add_header.

    # аудио не меняется — длинный immutable-кеш
    location ~* \.(mp3|wav)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # сама страница всегда ревалидируется — правки видны сразу после deploy.sh
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # служебные файлы репозитория наружу не отдаём
    location ~ /\.(git|gitignore) {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/volta-demo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/volta-demo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# http -> https (создано certbot-ом)
server {
    if ($host = volta-demo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name volta-demo.com;
    return 404; # managed by Certbot
}
server {
    if ($host = www.volta-demo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name www.volta-demo.com;
    return 404; # managed by Certbot
}
